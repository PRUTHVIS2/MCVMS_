# config/app.yaml: every threshold used by the code lives here (no magic numbers in code).
# Changing a value that affects accuracy needs measured evidence in docs/results/ (see AGENT_RULES 6b).

app:
  timezone: Asia/Kolkata
  mode: live                    # live | batch
  device: cuda                  # cuda | cpu (cpu allowed for tests; production must log a warning)

paths:
  data_dir: data
  models_dir: data/models
  backup: null                  # set to a folder to enable backup (storage_policy.yaml)
  ffmpeg: ffmpeg
  ffprobe: ffprobe

media:
  mediamtx_rtsp: "rtsp://localhost:8554"
  mediamtx_webrtc: "http://localhost:8889"
  mediamtx_hls: "http://localhost:8888"

analysis:
  fps: 8                        # analysed frames per second per camera
  detect_max_side: 960          # detection runs on a downscaled frame; boxes are mapped back to full-res
  min_vehicle_px: 80            # min vehicle box height (full-res px) to become a sighting
  min_person_px: 120            # min person box height (full-res px) for rules/ID
  lost_after_s: 1.5             # track lost this long -> track ended
  reader_queue: 2               # latest-frame slot; older frames are dropped

models:
  vehicle_detector: yolo11s.pt  # verify name/version against installed ultralytics
  person_pose: yolo11s-pose.pt
  plate_detector: plate.pt      # supplied by the human at data/models/plate.pt
  id_classifier: id_cls.pt      # produced by scripts/train_id_classifier.py
  class_map:                    # detector class name -> our category. Add auto_rickshaw / tempo when a custom model exists
    car: car
    motorcycle: two_wheeler
    bus: bus
    truck: truck
  vehicle_classes: [car, motorcycle, bus, truck]
  person_class: person

heavy_categories: [truck, bus]  # `heavy` attribute = category in this list (heuristic, see docs/01 s6)

vehicles:
  sighting:
    min_frames: 5
    max_sighting_s: 120         # long parked vehicle: finalised once, flagged long_dwell
    dedupe_window_s: 30         # same vehicle+camera again within this -> linked, no new clip
  category_vote_min_frames: 5
  category_vote_min_share: 0.6
  colour:
    enabled: true
    crop_drop_bottom_frac: 0.25
    night_v_threshold: 0.20     # mean V below this -> colour unknown
attributes:
  body_type:
    enabled: false              # optional soft attribute (zero-shot); enable only after human approval
    labels: [hatchback, sedan, suv, van, pickup]

plate:
  enabled: true
  min_vehicle_px: 80
  detector_conf: 0.50
  aspect_min: 1.5
  aspect_max: 6.5
  crop_pad_frac: 0.10
  min_plate_w_px: 60
  min_sharpness: 40
  sharpness_ref: 120
  target_plate_w_px: 140
  min_attempt_interval_s: 0.20
  max_attempts_per_track: 20
  budget_reads_per_s: 10        # global cap across cameras
  preprocess: []                # any of: contrast, sharpen, upscale2x (decided by step 11 results)
  polarity_normalise: true
  ocr_engine: easyocr           # verify install; paddleocr optional
  ocr_fallbacks: []
  vote_min_reads: 2
  single_read_min_conf: 0.85
  finalize_wait_s: 3
  repair_max: 2
  repair_penalty: 0.05
  store_read_crops: true
  formats:                      # regexes on normalised text; verify against real plates and extend
    - '^[A-Z]{2}[0-9]{2}[A-Z]{1,3}[0-9]{1,4}$'      # e.g. KA05AB1234, KA01A1234
    - '^[0-9]{2}BH[0-9]{4}[A-Z]{1,2}$'              # Bharat series

matching:
  top_k: 3
  candidate_min: 0.50
  exact_conf_min: 0.80
  auto_accept_score: 0.90
  fuzzy_score_min: 0.75
  margin_min: 0.10
  unregistered_conf_min: 0.75
  sub_cost: 1.0
  confusable_sub_cost: 0.3
  indel_cost: 1.0
  confusable_pairs: [[O,0],[I,1],[B,8],[S,5],[Z,2],[G,6],[D,0],[Q,0]]

identity:
  link_by_plate_fuzzy_score: 0.90
  appearance_enabled: true      # candidates only; disabled automatically if no embedder passes step 14
  embedder: null                # chosen at step 14 (openclip_vit_b32 | vehicle_reid | none)
  appearance_window_h: 6
  appearance_min_score: 0.85    # provisional; set from step 14 ROC
  appearance_margin: 0.05
  embeddings_per_vehicle: 10

review:
  deadline_local: "18:00"
  reminder_local: "09:00"
  spot_check_rate: 0.05
  snooze_days_default: 30

clips:
  sighting:
    length_s: 10
    pre_s: 4
    min_gap_s_same_vehicle_camera: 60
  event:
    pre_roll_s: 15
    hold_s: 20
    max_clip_min: {low: 2, medium: 5, critical: 15}
  reencode: true                # h264_nvenc, fallback libx264
  keyframes: 3

id_check:
  enabled: true
  approach_margin_px: 200       # evaluate persons this close to a zone with an armed id_state rule
  torso_pad_frac: 0.25
  classifier_input: 160
  shoulder_conf_min: 0.50
  min_torso_px: 70              # torso width in full-res px for a GOOD frame
  frontal_ratio_min: 0.35       # shoulder_width / torso_height
  blur_min: 30
  occlusion_iou_max: 0.30
  unusable_p_min: 0.60
  good_frame_min_interval_s: 0.15
  wear_p_min: 0.70
  wear_min_frames: 2
  absent_min_good_frames: 8
  absent_min_span_s: 1.0
  absent_p_id_max: 0.30
  absent_p_no_id_mean_min: 0.70
  evidence_crops: 5
  min_good_frames_probe: 8      # id_probe: tracks with at least this many good frames count as decidable
  lanyard_allowlist_enabled: false
  lanyard_allowlist_colours: []

rules:
  test_point: foot              # foot | centre
  tick_hz: 8
  confirm_n_of_m: [4, 5]
  min_confidence: 0.60
  hysteresis_drop: 0.15
  track_loss_tolerance_s: 1.5
  cooldown_s: 30
  default_hold_s: 20
  alert_ttl_min: {low: 240, medium: 480, critical: 1440}

training:
  test_dates: []                # frozen plate test set (dates YYYY-MM-DD)

health:
  frozen_stream_after_seconds: 30
  reconnect_backoff_seconds: [1, 2, 4, 8, 16, 32, 60]

privacy:
  incharge_can_view_id_clips: false
  audio_recording: false
  face_matching_enabled: false  # must stay false; biometric, out of scope
  person_names_visible_to: [owner, admin]

auth:
  jwt_expiry_minutes: 480
  login_rate_limit_per_min: 10

api:
  cors_origins: ["http://localhost:5173"]
  host: 127.0.0.1
  port: 8000
